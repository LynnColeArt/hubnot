name: Optional extension exact-package qualification

# The registered portability caller selects this workflow explicitly. A relative
# call runs this file at the same immutable caller commit, independent of H.
on:
  workflow_call:
    inputs:
      candidate_source:
        description: Exact committed candidate source H
        required: true
        type: string

permissions:
  contents: read

env:
  QUALIFICATION_VERSION: 0.0.0-optional-extensions-qualification.1
  QUALIFICATION_COMPILER: go1.26.4
  CALLER_SOURCE: ${{ github.sha }}
  CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
  CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}

jobs:
  build:
    name: Freeze optional extension candidate and references
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source: ${{ steps.freeze.outputs.source }}
      tree: ${{ steps.freeze.outputs.tree }}
      provenance: ${{ steps.freeze.outputs.provenance }}
      references: ${{ steps.freeze.outputs.references }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Require an immutable source selector before checkout
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_source }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache: false
      - name: Freeze all eight packages and twelve separate reference executables
        id: freeze
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/build-evidence"
          assets="$RUNNER_TEMP/qualification-assets"
          mkdir "$evidence" "$assets"
          exec > >(tee "$evidence/build.log") 2>&1
          trap 'result=$?; printf "%s\n" "$result" > "$evidence/exit"; date -u > "$evidence/finished"' EXIT
          date -u > "$evidence/started"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = "$QUALIFICATION_COMPILER"
          tree="$(git rev-parse HEAD^{tree})"
          go version > "$evidence/compiler.txt"
          go env GOMOD GOOS GOARCH GOVERSION > "$evidence/go-environment.txt"
          git ls-files -z '*.go' go.mod go.sum | xargs -0 sha256sum > "$evidence/source-inputs.before.sha256"
          jq -n --arg caller "$CALLER_SOURCE" --arg workflow_sha "$CALLER_WORKFLOW_SHA" --arg workflow_ref "$CALLER_WORKFLOW_REF" --arg candidate "$CANDIDATE_SOURCE" --arg tree "$tree" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" '{caller_source:$caller,caller_workflow_sha:$workflow_sha,caller_workflow_ref:$workflow_ref,candidate_source:$candidate,candidate_tree:$tree,run_id:$run,run_attempt:$attempt,job:$job,dispatch_inputs:{qualification:"optional-extensions",extension_source:$candidate}}' > "$evidence/binding.json"
          printf '%s\n' 'go run -buildvcs=false ./cmd/hn-release --source . --rev "$CANDIDATE_SOURCE" --version "$QUALIFICATION_VERSION" --out "$assets/candidate"' > "$evidence/commands.txt"
          go run -buildvcs=false ./cmd/hn-release --source . --rev "$CANDIDATE_SOURCE" --version "$QUALIFICATION_VERSION" --out "$assets/candidate"
          (cd "$assets/candidate" && sha256sum -c SHA256SUMS)
          mkdir "$assets/references"
          : > "$evidence/reference-assets.jsonl"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            target_dir="${target/\//_}"
            mkdir "$assets/references/$target_dir"
            for sample in fake-tracker charter inventory; do
              case "$sample" in
                fake-tracker) package=./examples/extensions/fake-tracker ;;
                charter) package=./examples/extensions/charter-model ;;
                inventory) package=./examples/extensions/inventory-model ;;
              esac
              name="$target_dir/$sample"
              printf 'CGO_ENABLED=0 GOOS=%s GOARCH=%s go build -buildvcs=false -trimpath -o references/%s %s\n' "${target%/*}" "${target#*/}" "$name" "$package" >> "$evidence/commands.txt"
              CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -buildvcs=false -trimpath -o "$assets/references/$name" "$package"
              go version -m "$assets/references/$name" > "$assets/references/$name.buildinfo"
              jq -n --arg name "$name" --arg target "$target" --arg sample "$sample" --arg package "$package" --arg sha256 "$(sha256sum "$assets/references/$name" | cut -d ' ' -f1)" --arg build_info_sha256 "$(sha256sum "$assets/references/$name.buildinfo" | cut -d ' ' -f1)" '{name:$name,target:$target,sample:$sample,package:$package,sha256:$sha256,build_info_sha256:$build_info_sha256}' >> "$evidence/reference-assets.jsonl"
            done
          done
          jq -s --arg source "$CANDIDATE_SOURCE" --arg tree "$tree" --arg compiler "$QUALIFICATION_COMPILER" '{schema:"hn.extension-references/1",source_commit:$source,source_tree:$tree,compiler:$compiler,flags:["-buildvcs=false","-trimpath"],assets:.}' "$evidence/reference-assets.jsonl" > "$assets/references/manifest.json"
          test "$(jq '.assets | length' "$assets/references/manifest.json")" = 12
          find "$assets" -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/frozen-assets.sha256"
          git ls-files -z '*.go' go.mod go.sum | xargs -0 sha256sum > "$evidence/source-inputs.after.sha256"
          cmp "$evidence/source-inputs.before.sha256" "$evidence/source-inputs.after.sha256"
          git diff --exit-code
          printf 'source=%s\ntree=%s\nprovenance=%s\nreferences=%s\n' "$CANDIDATE_SOURCE" "$tree" "$(sha256sum "$assets/candidate/PROVENANCE.json" | cut -d ' ' -f1)" "$(sha256sum "$assets/references/manifest.json" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: optional-extensions-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-assets/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-extensions-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-evidence/
          if-no-files-found: error
          retention-days: 30

  native:
    name: Extension native qualification (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux/amd64
            uname: x86_64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            uname: aarch64
          - runner: macos-15-intel
            target: darwin/amd64
            uname: x86_64
          - runner: macos-15
            target: darwin/arm64
            uname: arm64
    env:
      CANDIDATE_SOURCE: ${{ needs.build.outputs.source }}
      CANDIDATE_TREE: ${{ needs.build.outputs.tree }}
      CANDIDATE_PROVENANCE: ${{ needs.build.outputs.provenance }}
      REFERENCE_MANIFEST: ${{ needs.build.outputs.references }}
      CANDIDATE_ARTIFACT: ${{ needs.build.outputs.artifact }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      EXPECTED_TARGET: ${{ matrix.target }}
      EXPECTED_UNAME: ${{ matrix.uname }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/qualification-assets
      - name: Install qualification-only Linux syscall tracer
        if: startsWith(matrix.target, 'linux/')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Record actual platform, transport identities and precompile the harness
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/native-evidence"
          assets="$RUNNER_TEMP/qualification-assets"
          mkdir "$evidence" "$RUNNER_TEMP/unpacked"
          exec > >(tee "$evidence/prepare.log") 2>&1
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"
          test "$(go env GOVERSION)" = "$QUALIFICATION_COMPILER"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          {
            date -u
            uname -a
            go version
            go env GOMOD GOOS GOARCH GOVERSION
            git --version
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || true)"
              printf 'sysctl.proc_translated=%s\n' "${translated:-unavailable}"
              test "$translated" != 1
            else
              cat /etc/os-release
            fi
          } > "$evidence/environment.log" 2>&1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$evidence/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$evidence/jobs-at-start.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT" > "$evidence/candidate-artifact.json"
          jq -e --argjson id "$CANDIDATE_ARTIFACT" --argjson run "$GITHUB_RUN_ID" --arg digest "$CANDIDATE_ARTIFACT_DIGEST" '.id == $id and .expired == false and .workflow_run.id == $run and .digest == $digest' "$evidence/candidate-artifact.json"
          jq -n --arg caller "$CALLER_SOURCE" --arg workflow_sha "$CALLER_WORKFLOW_SHA" --arg workflow_ref "$CALLER_WORKFLOW_REF" --arg candidate "$CANDIDATE_SOURCE" --arg tree "$CANDIDATE_TREE" --arg artifact "$CANDIDATE_ARTIFACT" --arg digest "$CANDIDATE_ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg job "$GITHUB_JOB" --arg target "$EXPECTED_TARGET" '{caller_source:$caller,caller_workflow_sha:$workflow_sha,caller_workflow_ref:$workflow_ref,candidate_source:$candidate,candidate_tree:$tree,candidate_artifact_id:$artifact,candidate_artifact_digest:$digest,run_id:$run,run_attempt:$attempt,job:$job,target:$target,dispatch_inputs:{qualification:"optional-extensions",extension_source:$candidate}}' > "$evidence/binding.json"
          test "$(shasum -a 256 "$assets/candidate/PROVENANCE.json" | cut -d ' ' -f1)" = "$CANDIDATE_PROVENANCE"
          test "$(shasum -a 256 "$assets/references/manifest.json" | cut -d ' ' -f1)" = "$REFERENCE_MANIFEST"
          (cd "$assets/candidate" && shasum -a 256 -c SHA256SUMS) > "$evidence/transport-checksums.log"
          for archive in "$assets/candidate"/hubnot_"$QUALIFICATION_VERSION"_"${EXPECTED_TARGET%/*}"_"${EXPECTED_TARGET#*/}"*.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/unpacked"
          done
          # Artifact ZIP transport does not preserve executable mode. Restore it
          # without changing the executable bytes bound by the frozen manifest.
          chmod 0755 "$assets/references/${EXPECTED_TARGET/\//_}/fake-tracker" "$assets/references/${EXPECTED_TARGET/\//_}/charter" "$assets/references/${EXPECTED_TARGET/\//_}/inventory"
          git ls-files -z '*.go' go.mod go.sum | xargs -0 shasum -a 256 > "$evidence/source-inputs.before.sha256"
          printf '%s\n' 'go test -race -c -o "$RUNNER_TEMP/qualification-harness" .' > "$evidence/harness-command.txt"
          go test -race -c -o "$RUNNER_TEMP/qualification-harness" .
          shasum -a 256 "$RUNNER_TEMP/qualification-harness" > "$evidence/harness.sha256"
          go version -m "$RUNNER_TEMP/qualification-harness" > "$evidence/harness.buildinfo"
          printf 'TEST2JSON=%s/test2json\n' "$(go env GOTOOLDIR)" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/no-source-fallback"
          cat > "$RUNNER_TEMP/no-source-fallback/go" <<'TRAP'
          #!/bin/sh
          printf '%s\n' "$*" >> "$HN_WP25_GO_TRAP"
          exit 97
          TRAP
          chmod 0755 "$RUNNER_TEMP/no-source-fallback/go"
      - name: Preflight real syscall instrumentation and trace exact native commands
        id: trace
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-evidence/tracing"
          mkdir "$root"
          exec > >(tee "$root/preflight.log") 2>&1
          trap 'result=$?; printf "%s\n" "$result" > "$root/exit"; date -u > "$root/finished"' EXIT
          date -u > "$root/started"
          boundary=0
          for variant in standard native-only; do
            work="$root/$variant"
            mkdir "$work" "$work/home" "$work/repo"
            export HOME="$work/home" XDG_CONFIG_HOME="$work/home/xdg"
            export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=
            export PATH="$RUNNER_TEMP/no-source-fallback:$PATH"
            export HN_WP25_GO_TRAP="$work/go-fallback.log"
            suffix=
            [ "$variant" = standard ] || suffix=_native-only
            binary="$RUNNER_TEMP/unpacked/hubnot_${QUALIFICATION_VERSION}_${EXPECTED_TARGET%/*}_${EXPECTED_TARGET#*/}$suffix/hn"
            shasum -a 256 "$binary" > "$work/candidate.sha256"
            case "$EXPECTED_TARGET" in
              linux/*) config="$XDG_CONFIG_HOME" ;;
              darwin/*) config="$HOME/Library/Application Support" ;;
              *) exit 1 ;;
            esac
            registry="$config/hubnot/extensions/registry.json"
            printf '%s\n' "$registry" > "$work/actual-registry-path.txt"
            git init -q "$work/repo"
            cd "$work/repo"
            git config user.name 'WP25 trace'
            git config user.email wp25-trace@example.invalid
            "$binary" init --name 'WP25 trace' > "$work/init.out" 2> "$work/init.err"
            printf '%s\n' '{"protocol":"hn.extension-manifest/1","module_id":"example.wp25/trace","module_version":"1","host_protocol":"hn.extension/1","capabilities":["resource.read"]}' > "$work/manifest.json"
            printf '#!/bin/sh\nprintf started > "%s"\n' "$work/module-started" > "$work/module"
            chmod 0700 "$work/module"
            "$binary" extension register --manifest "$work/manifest.json" --executable "$work/module" --json > "$work/register.json" 2> "$work/register.err"
            jq -e '.ok == true and .data.status == "registered"' "$work/register.json"
            test -s "$registry"
            shasum -a 256 "$registry" > "$work/registry.before.sha256"
            find .git/hn "$config/hubnot" -type f -exec shasum -a 256 {} \; | sort > "$work/state.before.sha256"
            trace_command() {
              label="$1"
              shift
              printf '%s\n' "$*" > "$work/$label.command.txt"
              if [ "$(uname -s)" = Linux ]; then
                strace --version > "$work/tool.txt" 2>&1
                strace -f -qq -e trace=%file,process -o "$work/$label.trace" -- "$@" > "$work/$label.out" 2> "$work/$label.err"
                printf 'strace -f; candidate process and descendants\n' > "$work/$label.scope.txt"
              else
                # Gate exec until fs_usage is attached to this exact PID. The
                # descendant control below detects whether this scope suffices.
                gate="$work/$label.gate"
                mkfifo "$gate"
                /bin/sh -c 'read -r token < "$1"; shift; exec "$@"' wp25 "$gate" "$@" > "$work/$label.out" 2> "$work/$label.err" &
                subject=$!
                printf 'candidate/launcher PID=%s; fs_usage PID filter; descendant coverage requires positive control\n' "$subject" > "$work/$label.scope.txt"
                sudo -n /usr/bin/fs_usage -w -f filesystem -t 5 "$subject" > "$work/$label.trace" 2> "$work/$label.tool.err" &
                tracer=$!
                sleep 1
                printf 'execute\n' > "$gate"
                subject_status=0
                wait "$subject" || subject_status=$?
                tracer_status=0
                wait "$tracer" || tracer_status=$?
                printf 'subject_exit=%s\ntracer_exit=%s\n' "$subject_status" "$tracer_status" > "$work/$label.exits"
                test "$subject_status" = 0
                test "$tracer_status" = 0
              fi
            }
            trace_command inspect "$binary" extension inspect example.wp25/trace --json
            jq -e '.ok == true and (.data.modules | length == 1)' "$work/inspect.out"
            # Explicit management selected and read the actual registered bytes.
            # No arbitrary XDG sentinel stands in for the Darwin registry.
            grep -F "$registry" "$work/inspect.trace" > "$work/inspect.registry-events"
            grep -Ei 'open|read|RdData' "$work/inspect.registry-events" > "$work/inspect.read-control"
            for command in version help identity issue; do
              case "$command" in
                version) set -- "$binary" version ;;
                help) set -- "$binary" help ;;
                identity) set -- "$binary" identity show --json ;;
                issue) set -- "$binary" issue list --json ;;
              esac
              trace_command "native-$command" "$@"
              if grep -E 'registry\.json|enabled\.json|extensions\.json' "$work/native-$command.trace" > "$work/native-$command.forbidden-events"; then
                printf 'ordinary command accessed extension configuration: %s\n' "$command"
                exit 1
              fi
            done
            # Preserve an independent descendant-read control. A PID-only Darwin
            # trace is never silently promoted to a descendant absence proof.
            trace_command descendant-control /bin/sh -c 'cat "$1" >/dev/null; sleep 1' wp25 "$registry"
            if ! grep -F "$registry" "$work/descendant-control.trace" > "$work/descendant-control.registry-events"; then
              printf 'BLOCKING instrumentation boundary: %s %s tracer missed child registry read; candidate-PID observations only\n' "$EXPECTED_TARGET" "$variant" | tee "$work/instrumentation-boundary.txt"
              boundary=1
            fi
            test ! -e "$work/module-started"
            test ! -e "$work/go-fallback.log"
            shasum -a 256 "$registry" > "$work/registry.after.sha256"
            cmp "$work/registry.before.sha256" "$work/registry.after.sha256"
            find .git/hn "$config/hubnot" -type f -exec shasum -a 256 {} \; | sort > "$work/state.after.sha256"
            cmp "$work/state.before.sha256" "$work/state.after.sha256"
          done
          test "$boundary" = 0
      - name: Execute both exact native variants and standalone consumers
        id: journeys
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        env:
          HN_WP25_REFERENCE_DIR: ${{ runner.temp }}/qualification-assets/references
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/native-evidence"
          export PATH="$RUNNER_TEMP/no-source-fallback:$PATH"
          # Prove that the installed first Go selector is an active refusal.
          export HN_WP25_GO_TRAP="$evidence/go-trap-positive.log"
          if go version; then exit 1; fi
          test -s "$HN_WP25_GO_TRAP"
          result=0
          for variant in standard native-only; do
            export HN_WP25_VARIANT="$variant"
            export HN_WP25_EVIDENCE="$evidence/$variant"
            export HN_WP25_GO_TRAP="$evidence/$variant-go-fallback.log"
            mkdir "$HN_WP25_EVIDENCE"
            date -u > "$HN_WP25_EVIDENCE/started"
            printf '%s\n' 'qualification-harness -test.run ^TestExtensionPackageQualification$ -test.timeout 90m -hn-package-dir unpacked -hn-package-bundle candidate -hn-package-version 0.0.0-optional-extensions-qualification.1 -hn-package-compiler go1.26.4' > "$HN_WP25_EVIDENCE/command.txt"
            row=0
            "$TEST2JSON" -t -p hubnot "$RUNNER_TEMP/qualification-harness" -test.v=test2json -test.count=1 -test.timeout=90m -test.run '^TestExtensionPackageQualification$' -hn-package-dir "$RUNNER_TEMP/unpacked" -hn-package-bundle "$RUNNER_TEMP/qualification-assets/candidate" -hn-package-version "$QUALIFICATION_VERSION" -hn-package-compiler "$QUALIFICATION_COMPILER" 2>&1 | tee "$HN_WP25_EVIDENCE/results.jsonl" || row=$?
            printf '%s\n' "$row" > "$HN_WP25_EVIDENCE/exit"
            date -u > "$HN_WP25_EVIDENCE/finished"
            if [ "$row" != 0 ] || [ -e "$HN_WP25_GO_TRAP" ]; then result=1; fi
          done
          exit "$result"
      - name: Record final API identities and unchanged source
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/native-evidence"
          mkdir -p "$evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$evidence/jobs-at-end.json"
          git ls-files -z '*.go' go.mod go.sum | xargs -0 shasum -a 256 > "$evidence/source-inputs.after.sha256"
          cmp "$evidence/source-inputs.before.sha256" "$evidence/source-inputs.after.sha256"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: optional-extensions-native-${{ matrix.target == 'linux/amd64' && 'linux-amd64' || matrix.target == 'linux/arm64' && 'linux-arm64' || matrix.target == 'darwin/amd64' && 'darwin-amd64' || 'darwin-arm64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Require functional and instrumentation qualification
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          TRACE_OUTCOME: ${{ steps.trace.outcome }}
          JOURNEYS_OUTCOME: ${{ steps.journeys.outcome }}
          EVIDENCE_ARTIFACT: ${{ steps.upload.outputs.artifact-id }}
        run: |
          printf 'prepare=%s\ntrace=%s\njourneys=%s\nevidence_artifact_id=%s\n' "$PREPARE_OUTCOME" "$TRACE_OUTCOME" "$JOURNEYS_OUTCOME" "$EVIDENCE_ARTIFACT"
          test "$PREPARE_OUTCOME" = success
          test "$TRACE_OUTCOME" = success
          test "$JOURNEYS_OUTCOME" = success
          test -n "$EVIDENCE_ARTIFACT"
