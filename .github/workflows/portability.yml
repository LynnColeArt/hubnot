name: Filesystem portability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_mode:
        description: Build a new candidate or reuse immutable existing assets
        type: choice
        options: [build, reuse]
        default: build
      platform_scope:
        description: Native platforms to execute in this run
        type: choice
        options: [all, macos]
        default: all
      diagnostic_mode:
        description: Explicit observation only; never beta qualification
        type: choice
        options: [none, intel-standard-45, intel-standard-discussion-reply-120]
        default: none
      reuse_source:
        description: Exact candidate source commit (reuse only)
        type: string
      reuse_run_id:
        description: Originating candidate build run ID (reuse only)
        type: string
      reuse_artifact_id:
        description: Exact candidate artifact ID (reuse only)
        type: string
      reuse_provenance:
        description: Expected PROVENANCE.json SHA-256 (reuse only)
        type: string

env:
  CANDIDATE_VERSION: 0.1.0-beta.1

permissions:
  contents: read

concurrency:
  group: portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: Portability (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Record native platform and normal temporary environment
        shell: bash
        run: |
          uname -s -m
          go version
          git --version
          printf 'TMPDIR=%s\n' "${TMPDIR-<unset>}"
      - name: Filesystem and Go-only packager regressions
        run: go test -race -count=1 -timeout 10m ./internal/safepath ./internal/release ./cmd/hn-release
      - name: Migration boundary regressions
        # Deliberately do not physicalize paths or forward TMPDIR to children.
        run: go test -race -count=1 -timeout 10m -run '^(TestMigration.*|TestProjectSnapshot.*|TestPortableCollaborationAzure.*)$' .
      - name: Package the exact candidate for the native runner
        shell: bash
        run: |
          target="$(go env GOOS)/$(go env GOARCH)"
          go run ./cmd/hn-release --source . --rev "$(git rev-parse HEAD)" --version 0.0.0-portability-proof --targets "$target" --out "$RUNNER_TEMP/portability-packages"
          mkdir "$RUNNER_TEMP/portability-unpacked"
          for archive in "$RUNNER_TEMP/portability-packages"/hubnot_0.0.0-portability-proof_"$(go env GOOS)"_"$(go env GOARCH)"*.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/portability-unpacked"
          done
      - name: Actual standard and native-only package public journeys
        run: go test -race -count=1 -timeout 10m -v -run '^TestPortableCollaborationIntegratedPublicVariants$' . -args -hn-package-dir "$RUNNER_TEMP/portability-unpacked"
      - name: Static checks
        run: go vet ./...

  candidate-request:
    name: Validate optional candidate request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      diagnostic: ${{ steps.request.outputs.diagnostic }}
      matrix: ${{ steps.request.outputs.matrix }}
    steps:
      - name: Validate mode, complete reuse identity and fixed platform selection
        id: request
        shell: bash
        env:
          CANDIDATE_MODE: ${{ inputs.candidate_mode }}
          DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode }}
          PLATFORM_SCOPE: ${{ inputs.platform_scope }}
          REUSE_SOURCE: ${{ inputs.reuse_source }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          REUSE_ARTIFACT_ID: ${{ inputs.reuse_artifact_id }}
          REUSE_PROVENANCE: ${{ inputs.reuse_provenance }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_MODE" in
            build) test -z "$REUSE_SOURCE$REUSE_RUN_ID$REUSE_ARTIFACT_ID$REUSE_PROVENANCE" ;;
            reuse)
              [[ "$REUSE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
              [[ "$REUSE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$REUSE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$REUSE_PROVENANCE" =~ ^[0-9a-f]{64}$ ]]
              ;;
            *) exit 1 ;;
          esac
          case "$PLATFORM_SCOPE" in
            all) matrix='[{"runner":"ubuntu-24.04","target":"linux/amd64","uname":"x86_64"},{"runner":"ubuntu-24.04-arm","target":"linux/arm64","uname":"aarch64"},{"runner":"macos-15","target":"darwin/arm64","uname":"arm64"},{"runner":"macos-15-intel","target":"darwin/amd64","uname":"x86_64"}]' ;;
            macos) matrix='[{"runner":"macos-15","target":"darwin/arm64","uname":"arm64"},{"runner":"macos-15-intel","target":"darwin/amd64","uname":"x86_64"}]' ;;
            *) exit 1 ;;
          esac
          case "$DIAGNOSTIC_MODE" in
            none) ;;
            intel-standard-45|intel-standard-discussion-reply-120)
              test "$CANDIDATE_MODE" = reuse
              test "$PLATFORM_SCOPE" = macos
              test "$REUSE_SOURCE" = 5bedb38c2bf8f59938515114297aeedeb959e53f
              test "$REUSE_RUN_ID" = 40935607370
              test "$REUSE_ARTIFACT_ID" = 12925340544
              test "$REUSE_PROVENANCE" = a1e4ca916aa26fdc875fa5a7ee7467db8351ab2b717d9c9c109efe865c155578
              ;;
            *) exit 1 ;;
          esac
          printf 'mode=%s\ndiagnostic=%s\nmatrix=%s\n' "$CANDIDATE_MODE" "$DIAGNOSTIC_MODE" "$matrix" >> "$GITHUB_OUTPUT"

  candidate-build:
    name: Freeze one candidate bundle
    needs: candidate-request
    if: needs.candidate-request.outputs.mode == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source: ${{ steps.freeze.outputs.source }}
      tree: ${{ steps.freeze.outputs.tree }}
      provenance: ${{ steps.freeze.outputs.provenance }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      run: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build all eight packages once from committed source
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOVERSION)" = go1.26.4
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/candidate-evidence/source.txt"
          go version > "$RUNNER_TEMP/candidate-evidence/compiler.txt"
          go env GOMOD >> "$RUNNER_TEMP/candidate-evidence/source.txt"
          git ls-files -z '*.go' go.mod go.sum | xargs -0 sha256sum > "$RUNNER_TEMP/candidate-evidence/source-inputs.sha256"
          go run -buildvcs=false ./cmd/hn-release --source . --rev "$GITHUB_SHA" --version "$CANDIDATE_VERSION" --out "$RUNNER_TEMP/candidate" 2>&1 | tee "$RUNNER_TEMP/candidate-evidence/build.log"
          cd "$RUNNER_TEMP/candidate"
          sha256sum -c SHA256SUMS
          printf 'source=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          printf 'provenance=%s\n' "$(sha256sum PROVENANCE.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: beta-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-build-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-evidence/
          if-no-files-found: error
          retention-days: 30

  candidate-reuse:
    name: Resolve existing immutable candidate
    needs: candidate-request
    if: needs.candidate-request.outputs.mode == 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      tree: ${{ steps.resolve.outputs.tree }}
      provenance: ${{ steps.resolve.outputs.provenance }}
      artifact: ${{ inputs.reuse_artifact_id }}
      run: ${{ inputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.reuse_source }}
          persist-credentials: false
      - name: Validate same-repository origin and independently verify original bytes
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REUSE_SOURCE: ${{ inputs.reuse_source }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          REUSE_ARTIFACT_ID: ${{ inputs.reuse_artifact_id }}
          REUSE_PROVENANCE: ${{ inputs.reuse_provenance }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          evidence="$RUNNER_TEMP/reuse-evidence"
          mkdir "$evidence"
          test "$(git rev-parse HEAD)" = "$REUSE_SOURCE"
          test -z "$(git status --porcelain)"
          tree="$(git rev-parse HEAD^{tree})"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" > "$evidence/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REUSE_ARTIFACT_ID" > "$evidence/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/jobs?per_page=100" > "$evidence/jobs.json"
          jq -e --arg source "$REUSE_SOURCE" --argjson run "$REUSE_RUN_ID" --argjson repo "$REPOSITORY_ID" '.id == $run and .head_sha == $source and .repository.id == $repo and .head_repository.id == $repo and .event == "workflow_dispatch" and .path == ".github/workflows/portability.yml"' "$evidence/run.json"
          jq -e --arg source "$REUSE_SOURCE" --argjson run "$REUSE_RUN_ID" --argjson artifact "$REUSE_ARTIFACT_ID" --argjson repo "$REPOSITORY_ID" '.id == $artifact and .expired == false and .name == ("beta-candidate-" + $source) and .workflow_run.id == $run and .workflow_run.head_sha == $source and .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and (.digest | test("^sha256:[0-9a-f]{64}$"))' "$evidence/artifact.json"
          jq -e '[.jobs[] | select(.name == "Freeze one candidate bundle" and .conclusion == "success")] | length == 1' "$evidence/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REUSE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/candidate.zip"
          zip_digest="$(jq -r .digest "$evidence/artifact.json")"
          printf '%s  %s\n' "${zip_digest#sha256:}" "$RUNNER_TEMP/candidate.zip" | sha256sum -c -
          {
            printf 'PROVENANCE.json\nSHA256SUMS\nhubnot_%s_source.tar.gz\n' "$CANDIDATE_VERSION"
            for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
              printf 'hubnot_%s_%s.tar.gz\nhubnot_%s_%s_native-only.tar.gz\n' "$CANDIDATE_VERSION" "$target" "$CANDIDATE_VERSION" "$target"
            done
          } | sort > "$evidence/expected-members.txt"
          unzip -Z1 "$RUNNER_TEMP/candidate.zip" | sort > "$evidence/actual-members.txt"
          cmp "$evidence/expected-members.txt" "$evidence/actual-members.txt"
          unzip -p "$RUNNER_TEMP/candidate.zip" PROVENANCE.json > "$evidence/PROVENANCE.json"
          unzip -p "$RUNNER_TEMP/candidate.zip" SHA256SUMS > "$evidence/SHA256SUMS"
          test "$(sha256sum "$evidence/PROVENANCE.json" | cut -d ' ' -f1)" = "$REUSE_PROVENANCE"
          jq -e --arg source "$REUSE_SOURCE" --arg tree "$tree" --arg version "$CANDIDATE_VERSION" '.schema == "hn.release/1" and .source_commit == $source and .source_tree == $tree and .version == $version and .compiler == "go1.26.4" and (.assets | length == 9)' "$evidence/PROVENANCE.json"
          awk 'NF != 2 || length($1) != 64 || $1 ~ /[^0-9a-f]/ {exit 1}' "$evidence/SHA256SUMS"
          grep -v '^SHA256SUMS$' "$evidence/expected-members.txt" > "$evidence/expected-checksums.txt"
          awk '{print $2}' "$evidence/SHA256SUMS" | sort > "$evidence/actual-checksums.txt"
          cmp "$evidence/expected-checksums.txt" "$evidence/actual-checksums.txt"
          while read -r digest name; do
            test "$(unzip -p "$RUNNER_TEMP/candidate.zip" "$name" | sha256sum | cut -d ' ' -f1)" = "$digest"
          done < "$evidence/SHA256SUMS"
          jq -n --arg workflow "$GITHUB_SHA" --arg source "$REUSE_SOURCE" --arg tree "$tree" --arg run "$REUSE_RUN_ID" --arg artifact "$REUSE_ARTIFACT_ID" --arg provenance "$REUSE_PROVENANCE" '{mode:"reuse",workflow_source:$workflow,candidate_source:$source,candidate_tree:$tree,origin_run:$run,artifact_id:$artifact,provenance_sha256:$provenance}' > "$evidence/binding.json"
          printf 'source=%s\ntree=%s\nprovenance=%s\n' "$REUSE_SOURCE" "$tree" "$REUSE_PROVENANCE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-reuse-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reuse-evidence/
          if-no-files-found: error
          retention-days: 30

  candidate-native:
    name: Exact candidate (${{ matrix.target }})
    if: always() && github.event_name == 'workflow_dispatch' && needs.candidate-request.outputs.diagnostic == 'none' && needs.candidate-request.result == 'success' && ((needs.candidate-build.result == 'success' && needs.candidate-reuse.result == 'skipped') || (needs.candidate-reuse.result == 'success' && needs.candidate-build.result == 'skipped'))
    needs: [candidate-request, candidate-build, candidate-reuse]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.candidate-request.outputs.matrix) }}
    env:
      EXPECTED_TARGET: ${{ matrix.target }}
      EXPECTED_UNAME: ${{ matrix.uname }}
      FROZEN_SOURCE: ${{ needs.candidate-reuse.outputs.source || needs.candidate-build.outputs.source }}
      FROZEN_TREE: ${{ needs.candidate-reuse.outputs.tree || needs.candidate-build.outputs.tree }}
      FROZEN_PROVENANCE: ${{ needs.candidate-reuse.outputs.provenance || needs.candidate-build.outputs.provenance }}
      CANDIDATE_RUN: ${{ needs.candidate-reuse.outputs.run || needs.candidate-build.outputs.run }}
      CANDIDATE_ARTIFACT: ${{ needs.candidate-reuse.outputs.artifact || needs.candidate-build.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-reuse.outputs.source || needs.candidate-build.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidate-reuse.outputs.artifact || needs.candidate-build.outputs.artifact }}
          run-id: ${{ needs.candidate-reuse.outputs.run || needs.candidate-build.outputs.run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Observe native host and independently verify transported bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/native-evidence/processes"
          {
            date -u
            pwd
            printf 'executing-workflow-source=%s\ncandidate-source=%s\norigin-run=%s\nartifact-id=%s\n' "$GITHUB_SHA" "$FROZEN_SOURCE" "$CANDIDATE_RUN" "$CANDIDATE_ARTIFACT"
            git rev-parse HEAD HEAD^{tree}
            go env GOMOD GOOS GOARCH GOVERSION
            uname -a
            git --version
            printf 'TMPDIR=%s\n' "${TMPDIR-<unset>}"
            df -h . "$RUNNER_TEMP"
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || true)"
              printf 'sysctl.proc_translated=%s\n' "${translated-<unavailable>}"
              test "$translated" != 1
              stat -f '%T' . "$RUNNER_TEMP"
              diskutil info "$(df "$RUNNER_TEMP" | awk 'NR==2 {print $1}')"
              ls -ld /tmp /var /var/tmp
            else
              cat /etc/os-release
              stat -f -c '%T' . "$RUNNER_TEMP"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/native-evidence/environment.log"
          test "$(uname -m)" = "$EXPECTED_UNAME"
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FROZEN_TREE"
          test "$(go env GOVERSION)" = go1.26.4
          cd "$RUNNER_TEMP/candidate"
          test "$(shasum -a 256 PROVENANCE.json | cut -d ' ' -f1)" = "$FROZEN_PROVENANCE"
          shasum -a 256 -c SHA256SUMS | tee "$RUNNER_TEMP/native-evidence/transport-checksums.log"
          for archive in hubnot_"$CANDIDATE_VERSION"_"${EXPECTED_TARGET%/*}"_"${EXPECTED_TARGET#*/}"*.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/unpacked"
          done
          cd "$GITHUB_WORKSPACE"
          git ls-files -z '*.go' go.mod go.sum | xargs -0 shasum -a 256 > "$RUNNER_TEMP/native-evidence/source-inputs.before.sha256"
      - name: Verify bundle and exercise package install, memory and filesystem paths
        id: package-preflight
        shell: bash
        env:
          HN_PORTABLE_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
          HN_CONTRIBUTION_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
        run: |
          set -euo pipefail
          trap 'result=$?; printf "exit=%s\n" "$result" > "$RUNNER_TEMP/native-evidence/bundle.exit"; date -u > "$RUNNER_TEMP/native-evidence/bundle.finished"' EXIT
          date -u > "$RUNNER_TEMP/native-evidence/bundle.started"
          go test -race -count=1 -timeout=5m -v -run '^(TestBetaPlatformCandidateBundle|TestBetaPlatformPackageInstallAndRuntime)$' . -args -hn-package-dir "$RUNNER_TEMP/unpacked" -hn-package-bundle "$RUNNER_TEMP/candidate" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 2>&1 | tee "$RUNNER_TEMP/native-evidence/bundle.log"
      - name: Repeat released-writer refusals on the observed Linux Git hosts
        if: steps.package-preflight.outcome == 'success' && startsWith(matrix.target, 'linux/')
        shell: bash
        env:
          HN_PORTABLE_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
        run: |
          set -euo pipefail
          trap 'result=$?; printf "exit=%s\n" "$result" > "$RUNNER_TEMP/native-evidence/compatibility-repeat.exit"; date -u > "$RUNNER_TEMP/native-evidence/compatibility-repeat.finished"' EXIT
          date -u > "$RUNNER_TEMP/native-evidence/compatibility-repeat.started"
          go test -race -count=3 -timeout=10m -v -run '^TestBetaReleasedWriterCompatibility$' . -args -hn-package-dir "$RUNNER_TEMP/unpacked" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 2>&1 | tee "$RUNNER_TEMP/native-evidence/compatibility-repeat.log"
      - name: Actual package WP13 contribution and moderation public journeys
        if: always() && steps.package-preflight.outcome == 'success'
        shell: bash
        env:
          HN_CONTRIBUTION_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
        run: |
          set -euo pipefail
          trap 'result=$?; printf "exit=%s\n" "$result" > "$RUNNER_TEMP/native-evidence/wp13.exit"; date -u > "$RUNNER_TEMP/native-evidence/wp13.finished"' EXIT
          date -u > "$RUNNER_TEMP/native-evidence/wp13.started"
          go test -race -count=1 -timeout=45m -v -run '^TestBetaContributionPublicVariants$' . -args -hn-package-dir "$RUNNER_TEMP/unpacked" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 2>&1 | tee "$RUNNER_TEMP/native-evidence/wp13.log"
      - name: Actual package integrated collaboration, upgrade, recovery and migration journeys
        if: always() && steps.package-preflight.outcome == 'success'
        shell: bash
        env:
          HN_MIGRATION_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
          HN_PORTABLE_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
          HN_CONTRIBUTION_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
        run: |
          set -euo pipefail
          trap 'result=$?; printf "exit=%s\n" "$result" > "$RUNNER_TEMP/native-evidence/journeys.exit"; date -u > "$RUNNER_TEMP/native-evidence/journeys.finished"' EXIT
          date -u > "$RUNNER_TEMP/native-evidence/journeys.started"
          go test -race -count=1 -timeout=30m -v -run '^(TestPortableCollaborationIntegratedPublicVariants|TestBetaReleasedWriterCompatibility|TestBetaRecoveryJourneys|TestBetaRotationJournalRefusalPreservesRecovery|TestBetaMigrationFutureSessionRefusesWithoutReset|TestMigrationCLINativeOfflineBuildVariants|TestMigrationCLIGitLabToGitHubGuidedResumeAndOffline|TestMigrationCLIPublicRefusalsPreserveRemoteState)$' . -args -hn-package-dir "$RUNNER_TEMP/unpacked" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 2>&1 | tee "$RUNNER_TEMP/native-evidence/journeys.log"
          date -u > "$RUNNER_TEMP/native-evidence/journeys.finished"
      - name: WP12 recovery and contribution runtime against standard package
        if: always() && steps.package-preflight.outcome == 'success'
        shell: bash
        env:
          HN_CONTRIBUTION_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
        run: |
          set -euo pipefail
          trap 'result=$?; printf "exit=%s\n" "$result" > "$RUNNER_TEMP/native-evidence/wp12-standard.exit"; date -u > "$RUNNER_TEMP/native-evidence/wp12-standard.finished"' EXIT
          date -u > "$RUNNER_TEMP/native-evidence/wp12-standard.started"
          export HN_CONTRIBUTION_TEST_BINARY="$RUNNER_TEMP/unpacked/hubnot_${CANDIDATE_VERSION}_${EXPECTED_TARGET%/*}_${EXPECTED_TARGET#*/}/hn"
          export HN_CONTRIBUTION_TEST_BINARY_SHA256="sha256:$(shasum -a 256 "$HN_CONTRIBUTION_TEST_BINARY" | cut -d ' ' -f1)"
          go test -race -count=1 -timeout=20m -v -run '^TestContributionCLI' . -args -hn-package-dir "$RUNNER_TEMP/unpacked" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 2>&1 | tee "$RUNNER_TEMP/native-evidence/wp12-standard.log"
      - name: WP12 recovery and contribution runtime against native-only package
        if: always() && steps.package-preflight.outcome == 'success'
        shell: bash
        env:
          HN_CONTRIBUTION_TEST_TRANSCRIPTS: ${{ runner.temp }}/native-evidence/processes
        run: |
          set -euo pipefail
          trap 'result=$?; printf "exit=%s\n" "$result" > "$RUNNER_TEMP/native-evidence/wp12-native-only.exit"; date -u > "$RUNNER_TEMP/native-evidence/wp12-native-only.finished"' EXIT
          date -u > "$RUNNER_TEMP/native-evidence/wp12-native-only.started"
          export HN_CONTRIBUTION_TEST_BINARY="$RUNNER_TEMP/unpacked/hubnot_${CANDIDATE_VERSION}_${EXPECTED_TARGET%/*}_${EXPECTED_TARGET#*/}_native-only/hn"
          export HN_CONTRIBUTION_TEST_BINARY_SHA256="sha256:$(shasum -a 256 "$HN_CONTRIBUTION_TEST_BINARY" | cut -d ' ' -f1)"
          # The hidden-workflow publication witness deliberately uses standard.
          go test -race -count=1 -timeout=20m -v -run '^TestContributionCLI(AutomaticAndScopedModeration|BaselineGrowthRequiresLocalReservation|LocalCapacityBeforeNativeWritesAndRawCannotSelectTrust|GovernedSpecializedResourcesAndHiddenDependencies|DisabledPreservesNativeBehavior|WorktreesShareAccountingAndLockKeepLocalAuthority|ConflictsRevocationAndManufacturedHistoricalDecisions|RawRecoveryChargesLocalRetentionAndGuardsNewRefs|DurableArtifactRetryRecovery)$' . -args -hn-package-dir "$RUNNER_TEMP/unpacked" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 2>&1 | tee "$RUNNER_TEMP/native-evidence/wp12-native-only.log"
      - name: Verify immutable source and preserve evidence
        if: always()
        shell: bash
        run: |
          git ls-files -z '*.go' go.mod go.sum | xargs -0 shasum -a 256 > "$RUNNER_TEMP/native-evidence/source-inputs.after.sha256"
          cmp "$RUNNER_TEMP/native-evidence/source-inputs.before.sha256" "$RUNNER_TEMP/native-evidence/source-inputs.after.sha256"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.runner }}-${{ needs.candidate-reuse.outputs.source || needs.candidate-build.outputs.source }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: error
          retention-days: 30

  candidate-diagnostic:
    name: Diagnostic only (Intel standard observation)
    if: always() && github.event_name == 'workflow_dispatch' && needs.candidate-request.result == 'success' && (needs.candidate-request.outputs.diagnostic == 'intel-standard-45' || needs.candidate-request.outputs.diagnostic == 'intel-standard-discussion-reply-120') && needs.candidate-reuse.result == 'success' && needs.candidate-build.result == 'skipped'
    needs: [candidate-request, candidate-build, candidate-reuse]
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      FROZEN_SOURCE: ${{ needs.candidate-reuse.outputs.source }}
      FROZEN_TREE: ${{ needs.candidate-reuse.outputs.tree }}
      FROZEN_PROVENANCE: ${{ needs.candidate-reuse.outputs.provenance }}
      BASE_HARNESS_SHA256: d7438e11d0b5da89de1e3ebc226f6af614159f683d3a7ca5475fb01d392d12ed
      HN_BETA_DIAGNOSTIC_MODE: ${{ needs.candidate-request.outputs.diagnostic }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-reuse.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidate-reuse.outputs.artifact }}
          run-id: ${{ needs.candidate-reuse.outputs.run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Bind diagnostic subject without building an application
        id: diagnostic-bind
        shell: bash
        run: |
          set -euo pipefail
          export DIAGNOSTIC_EVIDENCE="$RUNNER_TEMP/diagnostic-evidence"
          mkdir -m 700 "$DIAGNOSTIC_EVIDENCE" "$RUNNER_TEMP/diagnostic-unpacked"
          printf 'DIAGNOSTIC_EVIDENCE=%s\n' "$DIAGNOSTIC_EVIDENCE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FROZEN_TREE"
          test "$(go env GOVERSION)" = go1.26.4
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/amd64
          test "$(uname -m)" = x86_64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          { date -u; uname -a; sw_vers; git --version; go version; } > "$DIAGNOSTIC_EVIDENCE/environment.log"
          git ls-files -z '*.go' go.mod go.sum docs/contributions.md | xargs -0 shasum -a 256 > "$DIAGNOSTIC_EVIDENCE/source.before.sha256"
          cd "$RUNNER_TEMP/candidate"
          test "$(shasum -a 256 PROVENANCE.json | cut -d ' ' -f1)" = "$FROZEN_PROVENANCE"
          shasum -a 256 -c SHA256SUMS > "$DIAGNOSTIC_EVIDENCE/transport-checksums.log"
          for suffix in '' _native-only; do
            tar -xzf "hubnot_${CANDIDATE_VERSION}_darwin_amd64${suffix}.tar.gz" -C "$RUNNER_TEMP/diagnostic-unpacked"
          done
          app="$RUNNER_TEMP/diagnostic-unpacked/hubnot_${CANDIDATE_VERSION}_darwin_amd64/hn"
          app_sha="$(shasum -a 256 "$app" | cut -d ' ' -f1)"
          test "$app_sha" = 42a8c16f7aed882a09469fae593181a721ed6564c8d9dfd4930d26b6a6756e3a
          shasum -a 256 "$app" > "$DIAGNOSTIC_EVIDENCE/app.before.sha256"
          jq -n --arg workflow "$GITHUB_SHA" --arg source "$FROZEN_SOURCE" --arg tree "$FROZEN_TREE" --arg provenance "$FROZEN_PROVENANCE" --arg app "$app_sha" --arg mode "$HN_BETA_DIAGNOSTIC_MODE" '{diagnostic_mode:$mode,diagnostic:true,qualification_eligible:false,workflow_source:$workflow,candidate_source:$source,candidate_tree:$tree,provenance_sha256:$provenance,origin_run:40935607370,artifact_id:12925340544,origin_zip_sha256:"e40d154999cf500d4bb3aa043a9ee72b111942aac58eb4452ec3b83607bd2dac",app_sha256:$app,ordinary_gate_seconds:45,selected_target_capture_seconds:(if $mode == "intel-standard-discussion-reply-120" then 120 else 45 end),raw_output_upload:false}' > "$DIAGNOSTIC_EVIDENCE/subject.json"
      - name: Generate reviewed external observation overlay
        if: steps.diagnostic-bind.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$DIAGNOSTIC_EVIDENCE/generate.py" <<'PY_DIAGNOSTIC'
          """Generate an external observation overlay; never edit the candidate checkout."""
          import hashlib, json, os
          from pathlib import Path

          base = Path(os.environ['GITHUB_WORKSPACE']) / 'beta_contribution_acceptance_test.go'
          out = Path(os.environ['DIAGNOSTIC_EVIDENCE'])
          out.mkdir(parents=True, exist_ok=True)
          source = base.read_text()
          assert hashlib.sha256(base.read_bytes()).hexdigest() == os.environ['BASE_HARNESS_SHA256']
          start = source.index('func (f *betaContributionCLI) process(')
          end = source.index('\nfunc (f *betaContributionCLI) hn(', start)
          original = source[start:end]
          assert original.count('45*time.Second') == 1
          assert original.count('ctx.Err() != nil || (err == nil) != ok') == 1
          replacement = r'''func (f *betaContributionCLI) process(dir, program string, ok bool, args ...string) []byte {
              f.t.Helper()
              f.diagnosticSequence++
              sequence := f.diagnosticSequence
              mode := os.Getenv("HN_BETA_DIAGNOSTIC_MODE")
              receive, target, operation, inputDigest, refs, captureSeconds := betaDiagnosticSelect(mode, f.t.Name(), f.binary, program, fmt.Sprintf("%x", f.digest), f.diagnosticCaptureUsed, args)
              if target { f.diagnosticCaptureUsed = true }
              if receive { betaDiagnosticJournal(f, dir, "before", sequence, 0, operation, inputDigest, refs) }
              ctx, cancel := context.WithTimeout(context.Background(), time.Duration(captureSeconds)*time.Second)
              defer cancel()
              p := exec.CommandContext(ctx, program, args...)
              p.Dir, p.Env = dir, f.env
              var output bytes.Buffer
              p.Stdout, p.Stderr = &output, &output
              started := time.Now()
              err := p.Start()
              pid := 0
              if p.Process != nil { pid = p.Process.Pid }
              programSHA := os.Getenv("HN_BETA_DIAGNOSTIC_GIT_SHA256")
              if program == f.binary { programSHA = fmt.Sprintf("%x", f.digest) }
              if programSHA == "" { f.t.Fatal("diagnostic executable digest unavailable") }
              betaDiagnosticWrite(f.t, map[string]any{"kind":"process-start", "command_sequence":sequence, "diagnostic_mode":mode, "test":f.t.Name(), "utc":started.UTC().Format(time.RFC3339Nano), "pid":pid, "program":p.Path, "argv":args, "executable_sha256":programSHA, "selected_app_sha256":fmt.Sprintf("%x", f.digest), "target":target, "receive":receive, "start_success":err == nil, "expected_ok":ok, "ordinary_gate_seconds":45, "capture_seconds":captureSeconds})
              if err == nil { err = p.Wait() }
              ended := time.Now()
              out := output.Bytes()
              commandContextErr := ctx.Err()
              cancel()
              marker := "not-applicable"
              if program == f.binary { marker = betaDiagnosticOutputMarker(out) }
              betaDiagnosticWrite(f.t, map[string]any{"kind":"process-end", "command_sequence":sequence, "test":f.t.Name(), "utc":ended.UTC().Format(time.RFC3339Nano), "elapsed_ns":ended.Sub(started).Nanoseconds(), "crossed_ordinary_gate":ended.Sub(started) > 45*time.Second, "pid":pid, "exit":fmt.Sprint(err), "context":fmt.Sprint(commandContextErr), "expectation_satisfied":commandContextErr == nil && (err == nil) == ok, "output_bytes":len(out), "output_sha256":fmt.Sprintf("%x", sha256.Sum256(out)), "observed_output_marker":marker, "target":target})
              if receive { betaDiagnosticJournal(f, dir, "after", sequence, pid, operation, inputDigest, refs) }
              if commandContextErr != nil || (err == nil) != ok {
                  f.t.Fatalf("%s %q: %v, deadline=%v; diagnostic omits raw output (%d bytes)", program, args, err, commandContextErr, len(out))
              }
              return out
          }
          '''
          helpers = r'''
          // External observation only: the unchanged release application is the subject.
          // The local fixture has an ordinary .git directory. No policy or CLI observer
          // is read/executed, and the project scope is exactly enabled(t.Name()).
          type betaDiagnosticManifest struct {
              Actor string `json:"actor"`
              Expected string `json:"expected"`
              Head string `json:"head"`
              Objects int64 `json:"objects,omitempty"`
              Bytes int64 `json:"bytes,omitempty"`
              ObjectsDurable bool `json:"objectsDurable,omitempty"`
              Complete bool `json:"complete"`
          }
          type betaDiagnosticAttempt struct {
              Intent string `json:"intent"`
              Artifact string `json:"artifact"`
              Status string `json:"status"`
              Reserved c.Cost `json:"reserved"`
              WireBytes int64 `json:"wireBytes"`
              DecodedBytes int64 `json:"decodedBytes"`
              Objects int64 `json:"objects"`
              Events int64 `json:"events"`
              Depth int64 `json:"depth"`
              Milliseconds int64 `json:"milliseconds"`
              Accounting string `json:"accounting"`
              ManifestWrites []betaDiagnosticManifest `json:"manifestWrites,omitempty"`
          }
          type betaDiagnosticState struct {
              Version string `json:"version"`
              Ledger c.Ledger `json:"ledger"`
              Attempts []betaDiagnosticAttempt `json:"attempts"`
          }

          func betaDiagnosticWrite(t *testing.T, record map[string]any) {
              t.Helper()
              record["diagnostic"] = true
              record["qualification_eligible"] = false
              name := filepath.Join(os.Getenv("HN_BETA_DIAGNOSTIC_DIR"), "observations.jsonl")
              file, err := os.OpenFile(name, os.O_WRONLY|os.O_APPEND|os.O_CREATE, 0600)
              if err != nil { t.Fatal("diagnostic output unavailable", err) }
              info, err := file.Stat()
              if err != nil || !info.Mode().IsRegular() { file.Close(); t.Fatal("diagnostic output type", err) }
              raw, err := betaDiagnosticEncode(record, info.Size())
              if err != nil { file.Close(); t.Fatal(err) }
              _, err = file.Write(raw)
              closeErr := file.Close()
              if err != nil || closeErr != nil { t.Fatal("diagnostic output write", err, closeErr) }
          }

          func betaDiagnosticEncode(record map[string]any, currentSize int64) ([]byte, error) {
              raw, err := json.Marshal(record)
              if err != nil { return nil, fmt.Errorf("diagnostic encode failure") }
              if len(raw) > 64<<10 { return nil, fmt.Errorf("diagnostic record exceeds output bound") }
              if currentSize < 0 || currentSize > 4<<20 || int64(len(raw)+1) > (4<<20)-currentSize { return nil, fmt.Errorf("diagnostic total output bound") }
              return append(raw, '\n'), nil
          }

          func betaDiagnosticSnapshot(repo, project string) map[string]any {
              result := map[string]any{"state":"unavailable", "project":project}
              // Only inspect the known fixture path; never search a .git tree or read keys.
              parts := []string{repo, ".git", "hn", "contribution", "inbox-"+strings.TrimPrefix(project, "sha256:"), "journal.json"}
              path := ""
              var observed os.FileInfo
              for i, part := range parts {
                  path = filepath.Join(path, part)
                  info, err := os.Lstat(path)
                  if err != nil { result["state"] = "missing-or-unreadable"; return result }
                  if info.Mode()&os.ModeSymlink != 0 || (i < len(parts)-1 && !info.IsDir()) {
                      result["state"] = "unsafe-path"; return result
                  }
                  observed = info
              }
              if !observed.Mode().IsRegular() { result["state"] = "nonregular"; return result }
              if observed.Size() > 1<<20 { result["state"] = "oversize"; result["bytes"] = observed.Size(); return result }
              file, err := os.Open(path)
              if err != nil { result["state"] = "open-failed"; return result }
              defer file.Close()
              actual, err := file.Stat()
              if err != nil || !actual.Mode().IsRegular() || !os.SameFile(observed, actual) { result["state"] = "changed-file"; return result }
              raw, err := io.ReadAll(io.LimitReader(file, (1<<20)+1))
              if err != nil { result["state"] = "read-failed"; return result }
              if len(raw) > 1<<20 { result["state"] = "oversize"; return result }
              result["bytes"] = len(raw)
              result["raw_sha256"] = fmt.Sprintf("%x", sha256.Sum256(raw))
              var journal betaDiagnosticState
              if json.Unmarshal(raw, &journal) != nil { result["state"] = "malformed-json"; return result }
              if journal.Ledger.Project != project { result["state"] = "project-mismatch"; return result }
              filtered, err := json.Marshal(journal)
              if err != nil || len(filtered) > 60<<10 { result["state"] = "filtered-output-oversize"; return result }
              result["state"] = "observed"
              result["last_durable_state_only"] = true
              result["journal"] = journal
              return result
          }

          func betaDiagnosticJournal(f *betaContributionCLI, repo, when string, sequence, pid int, operation, digest string, refs []string) {
              started := time.Now()
              project := c.Digest([]byte(f.t.Name()))
              result := betaDiagnosticSnapshot(repo, project)
              result["kind"] = "journal-observation"
              result["when"] = when
              result["test"] = f.t.Name()
              result["command_sequence"] = sequence
              result["pid"] = pid
              result["operation"] = operation
              result["input_digest"] = digest
              result["selected_refs"] = refs
              result["utc_start"] = started.UTC().Format(time.RFC3339Nano)
              result["utc_end"] = time.Now().UTC().Format(time.RFC3339Nano)
              result["elapsed_ns"] = time.Since(started).Nanoseconds()
              betaDiagnosticWrite(f.t, result)
          }
          // Only the explicit reviewed mode and exact standard case can select 120.
          func betaDiagnosticSelect(mode, testName, binary, program, executableSHA string, used bool, args []string) (receive, target bool, operation, digest string, refs []string, captureSeconds int) {
              captureSeconds = 45
              receive = program == binary && len(args) >= 2 && args[0] == "contribution" && args[1] == "receive"
              if !receive { return }
              operations, digests := 0, 0
              invalid := false
              for i := 2; i < len(args); i++ {
                  if (args[i] == "--operation" || args[i] == "--digest" || args[i] == "--ref" || args[i] == "--file") && i+1 >= len(args) { invalid = true; break }
                  switch args[i] {
                  case "--operation": operations++; operation = args[i+1]; i++
                  case "--digest": digests++; digest = args[i+1]; i++
                  case "--ref": refs = append(refs, args[i+1]); i++
                  case "--file": i++
                  }
              }
              if operations != 1 { operation = "ambiguous-or-missing" }
              if digests != 1 { digest = "" }
              if invalid || used || operations != 1 || digests != 1 || testName != "TestBetaContributionPublicVariants/standard/contributor-maintainer-keyless-observer" || executableSHA != "42a8c16f7aed882a09469fae593181a721ed6564c8d9dfd4930d26b6a6756e3a" { return }
              switch mode {
              case "intel-standard-45": target = operation == "proposal-intake"
              case "intel-standard-discussion-reply-120":
                  target = operation == "discussion-reply-intake"
                  if target { captureSeconds = 120 }
              }
              return
          }

          // This is an observed CLI output shape, never a phase or causal classification.
          func betaDiagnosticOutputMarker(raw []byte) string {
              if len(raw) == 0 { return "empty" }
              if len(raw) > 256 { return "oversize" }
              if bytes.HasPrefix(raw, []byte("hn: ")) && bytes.HasSuffix(raw, []byte("context deadline exceeded\n")) && bytes.Count(raw, []byte("\n")) == 1 && !bytes.Contains(raw, []byte("\r")) { return "hn_context_deadline_suffix" }
              return "other"
          }

          '''
          assert source.count('\t"fmt"\n') == 1
          source = source[:start] + replacement + source[end:]
          assert source.count('\tenv    []string\n') == 1
          source = source.replace('\tenv    []string\n', '\tenv    []string\n\tdiagnosticSequence int\n\tdiagnosticCaptureUsed bool\n', 1)
          source = source.replace('\t"fmt"\n', '\t"fmt"\n\t"io"\n', 1) + helpers
          overlay = out / 'beta_contribution_acceptance_test.go'
          overlay.write_text(source)
          (out / 'overlay.json').write_text(json.dumps({'Replace':{str(base):str(overlay)}}, indent=2)+'\n')
          binding = {'diagnostic':True, 'qualification_eligible':False, 'base_sha256':hashlib.sha256(base.read_bytes()).hexdigest(), 'overlay_sha256':hashlib.sha256(overlay.read_bytes()).hexdigest(), 'overlay_map_sha256':hashlib.sha256((out/'overlay.json').read_bytes()).hexdigest(), 'ordinary_gate_seconds':45, 'capture_target':'standard/contributor-maintainer-keyless-observer; discussion-reply-intake only in explicit 120 mode', 'journal_observers':'all selected app receives', 'output':'typed journal scalar/cost/manifest allowlist; raw application outputs omitted'}
          (out / 'overlay-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PY_DIAGNOSTIC
          python3 "$DIAGNOSTIC_EVIDENCE/generate.py"
          shasum -a 256 "$DIAGNOSTIC_EVIDENCE/generate.py" "$DIAGNOSTIC_EVIDENCE/overlay.json" "$DIAGNOSTIC_EVIDENCE/beta_contribution_acceptance_test.go" > "$DIAGNOSTIC_EVIDENCE/overlay.inputs.before.sha256"
      - name: Compile test harness only and verify the exact transported bundle
        id: diagnostic-preflight
        if: steps.diagnostic-bind.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          go test -race -c -overlay "$DIAGNOSTIC_EVIDENCE/overlay.json" -o "$RUNNER_TEMP/intel-diagnostic.test" . > "$RUNNER_TEMP/private-diagnostic-compile.log" 2>&1
          shasum -a 256 "$RUNNER_TEMP/intel-diagnostic.test" > "$DIAGNOSTIC_EVIDENCE/harness.before.sha256"
          "$RUNNER_TEMP/intel-diagnostic.test" -test.count=1 -test.timeout=5m -test.run '^TestBetaPlatformCandidateBundle$' -hn-package-dir "$RUNNER_TEMP/diagnostic-unpacked" -hn-package-bundle "$RUNNER_TEMP/candidate" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 > "$RUNNER_TEMP/private-diagnostic-preflight.log" 2>&1
      - name: Observe one original standard happy journey with explicit capture selection
        if: steps.diagnostic-preflight.outcome == 'success'
        shell: bash
        env:
          HN_BETA_DIAGNOSTIC_DIR: ${{ runner.temp }}/diagnostic-evidence
        run: |
          set -euo pipefail
          export HN_BETA_DIAGNOSTIC_GIT_SHA256="$(shasum -a 256 "$(command -v git)" | cut -d ' ' -f1)"
          # No raw test/application output is echoed or included in uploaded paths.
          set +e
          "$RUNNER_TEMP/intel-diagnostic.test" -test.v -test.count=1 -test.timeout=20m -test.run '^TestBetaContributionPublicVariants$/^standard$/^contributor-maintainer-keyless-observer$' -hn-package-dir "$RUNNER_TEMP/diagnostic-unpacked" -hn-package-version "$CANDIDATE_VERSION" -hn-package-compiler go1.26.4 > "$RUNNER_TEMP/private-diagnostic-runtime.log" 2>&1
          status=$?
          set -e
          export DIAGNOSTIC_STATUS="$status"
          python3 - <<'PY_OUTCOME'
          import json,os
          from pathlib import Path
          d=Path(os.environ['DIAGNOSTIC_EVIDENCE'])
          records=[json.loads(line) for line in (d/'observations.jsonl').read_text().splitlines()] if (d/'observations.jsonl').exists() else []
          starts=[r for r in records if r.get('kind')=='process-start']
          ends={r.get('command_sequence'):r for r in records if r.get('kind')=='process-end'}
          targets=[r for r in starts if r.get('target') and r.get('start_success') is True and type(r.get('pid')) is int and r['pid']>0]
          if len(targets)>1: raise SystemExit('diagnostic target selection invariant failed')
          target=targets[0] if targets else None
          terminal=ends.get(target['command_sequence']) if target else None
          if terminal and terminal.get('pid')!=target['pid']: raise SystemExit('diagnostic target PID invariant failed')
          result={'diagnostic':True,'qualification_eligible':False,'diagnostic_mode':os.environ['HN_BETA_DIAGNOSTIC_MODE'],'ordinary_gate_seconds':45,'overall_happy_case_test_exit':int(os.environ['DIAGNOSTIC_STATUS']),'target_reached':bool(target),'target_status':'launched' if target else 'target not reached','target_result':None,'helper_failures':[],'raw_output_uploaded':False,'observations':len(records),'observer_effects':'Journal reads before/after receives have separate elapsed records and may warm caches. Start metadata writes overlap command elapsed. Output markers and last durable journal state are not a proven phase or cause.'}
          if target:
           result['target_result']={'command_sequence':target['command_sequence'],'pid':target['pid'],'capture_seconds':target['capture_seconds'],'terminal_observed':terminal is not None,'ordinary_gate_seconds':45}
           if terminal:
            result['target_result'].update({key:terminal.get(key) for key in ['elapsed_ns','crossed_ordinary_gate','exit','context','observed_output_marker','expectation_satisfied','output_bytes']})
          for start in starts:
           end=ends.get(start.get('command_sequence'))
           if end and end.get('expectation_satisfied') is False:
            result['helper_failures'].append({'command_sequence':start['command_sequence'],'pid':start.get('pid'),'argv':start.get('argv'),'target':start.get('target'),'capture_seconds':start.get('capture_seconds'),**{key:end.get(key) for key in ['elapsed_ns','exit','context','observed_output_marker','crossed_ordinary_gate']}})
          (d/'outcome.json').write_text(json.dumps(result,indent=2)+'\n')
          if not target: raise SystemExit(1)
          PY_OUTCOME
          exit "$status"
      - name: Preserve immutable source identity
        if: always() && steps.diagnostic-bind.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.go' go.mod go.sum docs/contributions.md | xargs -0 shasum -a 256 > "$DIAGNOSTIC_EVIDENCE/source.after.sha256"
          cmp "$DIAGNOSTIC_EVIDENCE/source.before.sha256" "$DIAGNOSTIC_EVIDENCE/source.after.sha256"
          app="$RUNNER_TEMP/diagnostic-unpacked/hubnot_${CANDIDATE_VERSION}_darwin_amd64/hn"
          shasum -a 256 "$app" > "$DIAGNOSTIC_EVIDENCE/app.after.sha256"
          cmp "$DIAGNOSTIC_EVIDENCE/app.before.sha256" "$DIAGNOSTIC_EVIDENCE/app.after.sha256"
          if [ -f "$DIAGNOSTIC_EVIDENCE/overlay.inputs.before.sha256" ]; then
            shasum -a 256 "$DIAGNOSTIC_EVIDENCE/generate.py" "$DIAGNOSTIC_EVIDENCE/overlay.json" "$DIAGNOSTIC_EVIDENCE/beta_contribution_acceptance_test.go" > "$DIAGNOSTIC_EVIDENCE/overlay.inputs.after.sha256"
            cmp "$DIAGNOSTIC_EVIDENCE/overlay.inputs.before.sha256" "$DIAGNOSTIC_EVIDENCE/overlay.inputs.after.sha256"
          fi
          if [ -f "$DIAGNOSTIC_EVIDENCE/harness.before.sha256" ]; then
            shasum -a 256 "$RUNNER_TEMP/intel-diagnostic.test" > "$DIAGNOSTIC_EVIDENCE/harness.after.sha256"
            cmp "$DIAGNOSTIC_EVIDENCE/harness.before.sha256" "$DIAGNOSTIC_EVIDENCE/harness.after.sha256"
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-NOT-qualification-${{ inputs.diagnostic_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
